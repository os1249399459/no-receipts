name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write          # required for npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24      # ships npm >= 11.5.1, required for OIDC publish
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      # No NODE_AUTH_TOKEN / NPM_TOKEN anywhere: a leftover token silently
      # overrides OIDC and the publish fails with ENEEDAUTH or a 404 on PUT.
      - run: npm publish --access public
