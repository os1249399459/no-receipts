name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # Drift guard, FIRST: fail fast before npm ci if the shared-invariants
      # file has been deleted, renamed, or gutted. Pure fs read, no deps, so it
      # costs nothing to run before the slow steps.
      - name: Check cross-repo contract anchors
        run: node scripts/check-contract.mjs

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # The CLI tests exec dist/cli.js, so build must come before test.
      - run: npm test
